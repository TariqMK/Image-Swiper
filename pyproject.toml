[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-swiper"
version = "2.4.0"
description = "Windows desktop photo and video review tool"
requires-python = ">=3.10"
dependencies = ["Pillow", "piexif", "winshell; sys_platform == 'win32'", "pywin32; sys_platform == 'win32'", "Send2Trash; sys_platform != 'win32'"]

[project.optional-dependencies]
formats = ["pillow-heif", "rawpy"]

[project.scripts]
image-swiper = "image_swiper.__main__:main"

[tool.setuptools.packages.find]
include = ["image_swiper*"]
